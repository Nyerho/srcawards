<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in | Mr & Miss Fresh 2026</title><link rel="stylesheet" href="tailwind.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="js/app.js"></script></head>
<body class="fresh-bg min-h-screen flex items-center justify-center px-5 py-12"><main class="form-card w-full max-w-md"><a href="index.html" class="brand-mark">FRESH<span>26</span></a><p class="eyebrow mt-12">ADMIN ACCESS</p><h1 class="text-3xl font-black mt-3">Payment verification desk</h1><p class="mt-3 text-slate-600">Only event admins can review payment alerts and approve votes.</p><form id="loginForm" class="mt-8 space-y-5"><label>Email address<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-btn w-full justify-center" type="submit">Sign in <span>→</span></button></form><p id="error" class="mt-4 text-sm text-red-700"></p><a href="index.html" class="mt-6 inline-block text-sm font-bold text-slate-500">← Back to voting</a></main><script>
document.getElementById('loginForm').onsubmit=async(e)=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{if(!window.appState.firebaseReady())throw new Error('Firebase is not configured. Add your Firebase project details first.');const auth=window.appState.auth();const cred=await auth.signInWithEmailAndPassword(email.value.trim(),password.value);const admin=await window.appState.db().collection('admins').doc(cred.user.uid).get();if(!admin.exists){await auth.signOut();throw new Error('This account is not registered as an event admin.');}window.location.href='admin.html';}catch(err){error.textContent=err.message||'Sign in failed.';}};
</script></body></html>
