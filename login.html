<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRC Student Week Awards 2026 Login | Voting Portal</title>

<link rel="stylesheet" href="tailwind.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
.fade-in { animation: fadeIn 0.6s ease-in-out; }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>

<body class="mciu-theme min-h-screen flex items-center justify-center px-4 py-10">

<div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 sm:p-8 fade-in">

  <!-- Header -->
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex" aria-label="Home">
      <img src="images/IMG_4040.JPG" alt="SRC Logo" width="56" height="56" class="mciu-logo mciu-brand-img" style="width:56px;height:56px">
    </a>
    <h1 class="mt-4 text-2xl font-semibold">SRC Student Week Awards 2026 Login</h1>
    <p class="text-sm text-gray-500">Student Representative Council (SRC)</p>
  </div>

  <!-- Login Form -->
  <form class="space-y-5">

    <div class="grid grid-cols-2 gap-3">
      <button type="button" id="modeVoterBtn" class="w-full border py-2 rounded-lg bg-primary text-white">Voter</button>
      <button type="button" id="modeAdminBtn" class="w-full border py-2 rounded-lg bg-white text-gray-700">Admin</button>
    </div>

    <!-- Matric Number -->
    <div id="voterMatricWrap">
      <label class="block text-sm font-medium text-gray-700 mb-1">Matric Number</label>
      <input type="text" id="matric" placeholder="e.g. NS/CS/24/0936" required
        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>

    <!-- Password with eye toggle -->
    <div id="adminPasswordWrap" class="relative hidden">
      <label class="block text-sm font-medium text-gray-700 mb-1">Admin Password</label>
      <input type="password" id="password" placeholder="••••••••"
        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary pr-10" />
      <button type="button" id="togglePassword" class="absolute inset-y-0 right-3 flex items-center text-gray-500">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </button>
    </div>

    <!-- Info -->
    <div id="infoRow" class="flex items-center justify-between text-sm">
      <span class="text-gray-500">All students • One vote</span>
      <a href="#" class="text-primary hover:underline">Forgot password?</a>
    </div>

    <!-- Login Button -->
    <button type="submit" class="w-full mciu-btn py-3 rounded-lg text-lg transition">Login & Proceed</button>

  </form>

  <p class="mt-8 text-center text-xs text-gray-500">Authorized by the SRC Body</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

function isPlaceholderFirebaseConfig(cfg) {
  const v = (s) => String(s || '');
  return (
    v(cfg.apiKey).startsWith('YOUR_') ||
    v(cfg.authDomain).includes('YOUR_PROJECT') ||
    v(cfg.projectId).startsWith('YOUR_') ||
    v(cfg.messagingSenderId).startsWith('YOUR_') ||
    v(cfg.appId).startsWith('YOUR_')
  );
}

let firebaseReady = false;
let auth = null;
let db = null;

try {
  if (!isPlaceholderFirebaseConfig(firebaseConfig)) {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch {}
    firebaseReady = true;
  }
} catch {}

const ADMIN_EMAIL = 'admin@srcstudentweekawards.com';
const LOCAL_ADMIN_PASSWORD = 'admin123';

const form = document.querySelector('form');
const matricInput = document.getElementById('matric');
const voterMatricWrap = document.getElementById('voterMatricWrap');
const infoRow = document.getElementById('infoRow');
const modeVoterBtn = document.getElementById('modeVoterBtn');
const modeAdminBtn = document.getElementById('modeAdminBtn');
const adminPasswordWrap = document.getElementById('adminPasswordWrap');
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');
const submitBtn = document.querySelector('button[type="submit"]');

let loginMode = 'voter';
function setMode(nextMode) {
  loginMode = nextMode === 'admin' ? 'admin' : 'voter';
  const isAdmin = loginMode === 'admin';

  if (voterMatricWrap) voterMatricWrap.classList.toggle('hidden', isAdmin);
  if (adminPasswordWrap) adminPasswordWrap.classList.toggle('hidden', !isAdmin);
  if (infoRow) infoRow.classList.toggle('hidden', isAdmin);
  if (matricInput) matricInput.required = !isAdmin;

  if (modeVoterBtn) {
    modeVoterBtn.classList.toggle('bg-primary', !isAdmin);
    modeVoterBtn.classList.toggle('text-white', !isAdmin);
    modeVoterBtn.classList.toggle('bg-white', isAdmin);
    modeVoterBtn.classList.toggle('text-gray-700', isAdmin);
  }
  if (modeAdminBtn) {
    modeAdminBtn.classList.toggle('bg-primary', isAdmin);
    modeAdminBtn.classList.toggle('text-white', isAdmin);
    modeAdminBtn.classList.toggle('bg-white', !isAdmin);
    modeAdminBtn.classList.toggle('text-gray-700', !isAdmin);
  }

  submitBtn.innerText = isAdmin ? 'Login as Admin' : 'Login & Proceed';

  if (isAdmin) {
    if (passwordInput) passwordInput.focus();
  } else {
    if (passwordInput) {
      passwordInput.value = '';
      passwordInput.type = 'password';
    }
    if (matricInput) matricInput.focus();
  }
}
function resetSubmit() {
  submitBtn.disabled = false;
  submitBtn.classList.remove('opacity-50', 'pointer-events-none');
  submitBtn.innerText = loginMode === 'admin' ? 'Login as Admin' : 'Login & Proceed';
}
function navigate(path) {
  try {
    window.location.assign(path);
  } catch {}
  setTimeout(() => {
    // fallback in case navigation is blocked
    resetSubmit();
  }, 2000);
}

function safeDocId(value) {
  return String(value || '').trim().replace(/[\/#?\[\]]/g, '_');
}

if (modeVoterBtn) modeVoterBtn.addEventListener('click', () => setMode('voter'));
if (modeAdminBtn) modeAdminBtn.addEventListener('click', () => setMode('admin'));
setMode('voter');

togglePassword.addEventListener('click', () => {
  if (adminPasswordWrap.classList.contains('hidden')) return;
  const isHidden = passwordInput.type === 'password';
  passwordInput.type = isHidden ? 'text' : 'password';
  eyeIcon.innerHTML = isHidden
    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"/>'
    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';
});

/* ===== SUBMIT ===== */
form.addEventListener('submit', e => {
  e.preventDefault();

  const matric = matricInput ? matricInput.value.trim() : '';
  const password = passwordInput.value.trim();
  submitBtn.disabled = true;
  submitBtn.classList.add('opacity-50', 'pointer-events-none');
  submitBtn.innerText = 'Processing...';

  // clear previous session
  localStorage.removeItem('currentUser');
  try { auth && auth.signOut && auth.signOut(); } catch {}

  /* ===== ADMIN ===== */
  if (loginMode === 'admin') {
    (async () => {
      if (!password) {
        alert('Enter admin password');
        resetSubmit();
        return;
      }
      if (!firebaseReady) {
        if (password !== LOCAL_ADMIN_PASSWORD) {
          alert('Invalid admin password');
          resetSubmit();
          return;
        }
        localStorage.setItem('currentUser', JSON.stringify({
          matric: 'ADMIN',
          role: 'admin',
          uid: 'LOCAL'
        }));
        navigate('admin.html');
        return;
      }

      const cred = await auth.signInWithEmailAndPassword(ADMIN_EMAIL, password);
      const uid = cred?.user?.uid || '';
      localStorage.setItem('currentUser', JSON.stringify({ matric: 'ADMIN', role: 'admin', uid }));
      navigate('admin.html');
    })().catch((e) => {
      alert(e?.message || 'Admin login failed');
      resetSubmit();
    });
    return;
  }

  /* ===== STUDENT ===== */
  if (!matric) {
    alert('Enter your matric number');
    resetSubmit();
    return;
  }

  const normalizedMatric = matric.replace(/\s+/g, '').toUpperCase();
  const matricRegex = /^[A-Z0-9\/-]{3,}$/i;

  if (!matricRegex.test(normalizedMatric)) {
    alert('Enter a valid matric number');
    resetSubmit();
    return;
  }

  // Fast path: set session and navigate immediately
  localStorage.setItem('currentUser', JSON.stringify({
    matric: normalizedMatric,
    role: 'student'
  }));
  navigate('dashboard.html');
  // Best-effort registration, non-blocking
  if (firebaseReady) {
    setTimeout(async () => {
      try {
        const voterRef = db.collection('voters').doc(safeDocId(normalizedMatric));
        const now = firebase.firestore.FieldValue.serverTimestamp();
        await voterRef.set({
          matric: normalizedMatric,
          faculty: 'ALL',
          createdAt: now,
          lastLoginAt: now,
          completedAt: null
        }, { merge: true });
      } catch {}
    }, 200);
  }
});
</script>


</body>
</html>
