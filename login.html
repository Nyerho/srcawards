<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in | Mr & Miss Fresh 2026</title><link rel="stylesheet" href="tailwind.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="js/app.js"></script></head>
<body class="fresh-bg min-h-screen flex items-center justify-center px-5 py-12"><main class="form-card w-full max-w-md"><a href="index.html" class="brand-lockup"><img class="site-logo" src="images/src-body-logo.jpg" alt="SRC Body logo"><span class="brand-mark">FRESH<span>26</span></span></a><p class="eyebrow mt-12">ADMIN ACCESS</p><h1 class="text-3xl font-black mt-3">Payment verification desk</h1><p class="mt-3 text-slate-600">Only event admins can review payment alerts and approve votes.</p><form id="loginForm" class="mt-8 space-y-5"><label>Email address<input id="email" type="email" value="admin@freshersnight2026.com" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-btn w-full justify-center" type="submit">Sign in <span>→</span></button><button id="resetPassword" type="button" class="mt-3 w-full text-sm font-bold text-pink-600">Send password reset email</button></form><p id="error" class="mt-4 text-sm text-red-700"></p><a href="index.html" class="mt-6 inline-block text-sm font-bold text-slate-500">← Back to voting</a></main><script>
const error=document.getElementById('error');const emailInput=document.getElementById('email');const passwordInput=document.getElementById('password');const resetButton=document.getElementById('resetPassword');function explainAuthError(err){const code=String(err?.code||'');if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found')return 'The email/password does not match a Firebase Authentication user in the mciuvoting project. The admins document alone does not create a password. Use the reset button or create/reset the user in Firebase Authentication.';if(code==='auth/operation-not-allowed')return 'Email/Password sign-in is disabled. In Firebase Console, open Authentication → Sign-in method and enable Email/Password.';if(code==='auth/invalid-api-key'||code==='auth/app-not-authorized')return 'This site is connected to a different or unauthorized Firebase project. Confirm the Firebase config belongs to mciuvoting.';return err?.message||'Sign in failed.';}document.getElementById('loginForm').onsubmit=async(e)=>{e.preventDefault();error.textContent='';try{if(!window.appState.firebaseReady())throw new Error('Firebase is not configured. Add your Firebase project details first.');const auth=window.appState.auth();const cred=await auth.signInWithEmailAndPassword(emailInput.value.trim(),passwordInput.value);const admin=await window.appState.db().collection('admins').doc(cred.user.uid).get();if(!admin.exists){await auth.signOut();throw new Error('This account is not registered as an event admin. Add its Firebase UID to the admins collection.');}window.location.href='admin.html';}catch(err){error.textContent=explainAuthError(err);}};resetButton.onclick=async()=>{error.textContent='';try{if(!window.appState.firebaseReady())throw new Error('Firebase is not configured.');await window.appState.auth().sendPasswordResetEmail(emailInput.value.trim());error.className='mt-4 text-sm text-emerald-700';error.textContent='Password reset email sent. Check your inbox and spam folder.';}catch(err){error.className='mt-4 text-sm text-red-700';error.textContent=explainAuthError(err);}};
</script></body></html>
