[build]
  command = "npm run build"
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/login.html?admin=1"
  status = 302

[[redirects]]
  from = "/vote"
  to = "/vote-now.html?rev=20261115"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/vote"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/vote.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[redirects]]
  from = "/vote-now"
  to = "/vote-now.html?rev=20261115"
  status = 200

[[headers]]
  for = "/vote-now.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
