<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard | Mr & Miss Fresh 2026</title><link rel="stylesheet" href="tailwind.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="firebase-config.js"></script><script src="js/app.js"></script></head>
<body class="fresh-bg min-h-screen"><header class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between"><a href="index.html" class="brand-mark">FRESH<span>26</span></a><div class="flex items-center gap-4"><span id="adminEmail" class="hidden text-sm text-slate-500 sm:inline"></span><button id="logout" class="text-sm font-bold text-pink-600">Sign out</button></div></header><main class="max-w-7xl mx-auto px-5 pb-16"><div class="flex flex-wrap items-end justify-between gap-5"><div><p class="eyebrow">CONTROL ROOM</p><h1 class="section-title mt-3">Payment verification</h1><p class="mt-2 text-slate-600">Approve confirmed transfers. Approved amount ÷ ₦100 is added to the nominee.</p></div><div class="live-pill">● Live alerts <span id="pendingCount">0</span></div></div><section class="stats-grid mt-8"><div class="stat-card"><span>Pending</span><strong id="pendingStat">0</strong></div><div class="stat-card"><span>Approved votes</span><strong id="approvedStat">0</strong></div><div class="stat-card"><span>Approved value</span><strong id="valueStat">₦0</strong></div></section><section class="form-card mt-10"><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="section-kicker">INBOX</p><h2 class="text-2xl font-black">Payment submissions</h2></div><label class="secondary-btn cursor-pointer">Import nominees (.zip, .json or .csv)<input id="nomineeFile" type="file" accept=".zip,.json,.csv,application/zip,application/json,text/csv" class="hidden"></label></div><div id="payments" class="mt-6 space-y-4"><div class="empty-card">Loading payment alerts…</div></div></section><section class="form-card mt-10"><p class="section-kicker">LEADERBOARD</p><h2 class="text-2xl font-black">Approved votes by nominee</h2><div id="leaderboard" class="mt-6 space-y-3"></div></section></main>
<script>
const {db,auth}=window.appState;const {showToast,formatDate,loadNominees,accountDetails,escapeHtml}=window.appUtils;let submissions=[];let nominees=[];let unsubscribe=null;function money(n){return `₦${Number(n||0).toLocaleString()}`;}function render(){const pending=submissions.filter(x=>x.status==='pending');document.getElementById('pendingCount').textContent=pending.length;document.getElementById('pendingStat').textContent=pending.length;document.getElementById('approvedStat').textContent=submissions.filter(x=>x.status==='approved').reduce((s,x)=>s+Number(x.voteUnits||0),0).toLocaleString();document.getElementById('valueStat').textContent=money(submissions.filter(x=>x.status==='approved').reduce((s,x)=>s+Number(x.amount||0),0));document.getElementById('payments').innerHTML=pending.length?pending.map(x=>`<article class="payment-row"><div class="flex-1"><div class="flex flex-wrap items-center gap-2"><span class="category-tag">${escapeHtml(x.category)}</span><span class="text-xs text-slate-500">${formatDate(x.createdAt)}</span></div><h3 class="mt-2 text-lg font-black">${escapeHtml(x.nomineeName)} <span class="text-pink-600">· ${x.voteUnits} votes</span></h3><p class="mt-1 text-sm text-slate-600">${escapeHtml(x.fullName)} · ${escapeHtml(x.phone)} · ${escapeHtml(x.bank||'Bank not stated')}</p><p class="mt-1 text-sm text-slate-500">Payment: <b>${money(x.amount)}</b> · Ref: ${escapeHtml(x.paymentReference)}</p>${x.senderName?`<p class="text-sm text-slate-500">Sender account: ${escapeHtml(x.senderName)}</p>`:''}</div><div class="flex shrink-0 gap-2"><button class="approve-btn" data-id="${x.id}">Approve</button><button class="reject-btn" data-id="${x.id}">Reject</button></div></article>`).join(''):'<div class="empty-card">No pending payments. New submissions will appear here automatically.</div>';document.querySelectorAll('.approve-btn').forEach(b=>b.onclick=()=>moderate(b.dataset.id,'approved'));document.querySelectorAll('.reject-btn').forEach(b=>b.onclick=()=>moderate(b.dataset.id,'rejected'));const totals={};submissions.filter(x=>x.status==='approved').forEach(x=>totals[x.nomineeName]=(totals[x.nomineeName]||0)+Number(x.voteUnits||0));document.getElementById('leaderboard').innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([name,votes],i)=>`<div class="leader-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="flex-1 font-bold">${escapeHtml(name)}</span><strong>${votes.toLocaleString()} votes</strong></div>`).join('')||'<div class="empty-card">No approved votes yet.</div>';}
async function moderate(id,status){const row=submissions.find(x=>x.id===id);if(!row||!confirm(`${status==='approved'?'Approve':'Reject'} ${row.voteUnits} vote(s) for ${row.nomineeName}?`))return;try{const ref=db().collection('paymentSubmissions').doc(id);await db().runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists||snap.data().status!=='pending')throw new Error('This submission was already reviewed.');const data=snap.data();if(status==='approved'){const nomineeRef=db().collection('nominees').doc(data.nomineeId);const nominee=await tx.get(nomineeRef);if(!nominee.exists)throw new Error('Nominee no longer exists.');tx.update(nomineeRef,{votes:Number(nominee.data().votes||0)+Number(data.voteUnits||0)});}tx.update(ref,{status,reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),reviewedBy:auth().currentUser.uid,approvedVotes:status==='approved'?Number(data.voteUnits||0):0});});showToast(status==='approved'?'Payment approved and votes counted.':'Payment rejected.');}catch(e){showToast(e.message||'Could not update payment.','error');}}
async function start(){if(!window.appUtils.requireAdmin())return;document.getElementById('adminEmail').textContent=auth().currentUser.email||'';nominees=await loadNominees();if(window.appState.firebaseReady()){unsubscribe=db().collection('paymentSubmissions').orderBy('createdAt','desc').onSnapshot(snap=>{submissions=snap.docs.map(d=>({id:d.id,...d.data()}));render();},()=>showToast('Could not listen for payment alerts.','error'));}render();}document.getElementById('logout').onclick=async()=>{await auth().signOut();location.href='index.html';};document.getElementById('nomineeFile').onchange=async(e)=>{const file=e.target.files[0];if(!file)return;try{let text='';if(file.name.toLowerCase().endsWith('.zip')){const zip=await JSZip.loadAsync(file);const entry=Object.values(zip.files).find(x=>!x.dir&&/\.(json|csv)$/i.test(x.name));if(!entry)throw new Error('ZIP must contain a .json or .csv file.');text=await entry.async('text');}else{text=await file.text();}let rows=[];if(file.name.toLowerCase().endsWith('.json')||text.trim().startsWith('[')){rows=JSON.parse(text);}else{const lines=text.trim().split(/\r?\n/).filter(Boolean);const headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());rows=lines.map(line=>{const values=line.split(',').map(x=>x.trim());return Object.fromEntries(headers.map((h,i)=>[h,values[i]||'']));});}if(!Array.isArray(rows)||!rows.length)throw new Error('No nominee rows found.');const batch=db().batch();rows.forEach(row=>{const name=String(row.name||row.nominee||row.nomineename||'').trim();const category=String(row.category||row.position||'').trim().toUpperCase();if(!name||!category)return;const id=String(row.id||`${window.appUtils.safeId(category)}__${window.appUtils.safeId(name)}`);batch.set(db().collection('nominees').doc(id),{name,category,votes:Number(row.votes||0),image:String(row.image||'')},{merge:true});});await batch.commit();showToast('Nominee list imported. Refresh the voting page.');}catch(err){showToast(err.message||'Could not import nominee list.','error');}e.target.value='';};start();
</script></body></html>
