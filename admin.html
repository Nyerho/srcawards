<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard | Mr & Miss Fresh 2026</title><link rel="stylesheet" href="tailwind.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="firebase-config.js"></script><script src="js/app.js"></script></head>
<body class="fresh-bg min-h-screen"><header class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between"><a href="index.html" class="brand-lockup"><img class="site-logo" src="images/src-body-logo.jpg" alt="SRC Body logo"><span class="brand-mark">FRESH<span>26</span></span></a><div class="flex items-center gap-4"><span id="adminEmail" class="hidden text-sm text-slate-500 sm:inline"></span><button id="logout" class="text-sm font-bold text-pink-600">Sign out</button></div></header><main class="max-w-7xl mx-auto px-5 pb-16"><div class="flex flex-wrap items-end justify-between gap-5"><div><p class="eyebrow">CONTROL ROOM</p><h1 class="section-title mt-3">Payment verification</h1><p class="mt-2 text-slate-600">Approve confirmed transfers. Approved amount ÷ ₦100 is added to the nominee.</p></div><div class="live-pill">● Live alerts <span id="pendingCount">0</span></div><div class="flex items-center gap-3"><button id="restartVoting" class="reject-btn" type="button">Restart voting</button><span id="restartStatus" class="text-xs text-slate-500"></span></div></div><section class="stats-grid mt-8"><div class="stat-card"><span>Pending</span><strong id="pendingStat">0</strong></div><div class="stat-card"><span>Approved votes</span><strong id="approvedStat">0</strong></div><div class="stat-card"><span>Approved value</span><strong id="valueStat">₦0</strong></div></section><section class="form-card mt-10"><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="section-kicker">INBOX</p><h2 class="text-2xl font-black">Payment submissions</h2></div><label class="secondary-btn cursor-pointer">Import nominees (.zip, .json or .csv)<input id="nomineeFile" type="file" accept=".zip,.json,.csv,application/zip,application/json,text/csv" class="hidden"></label><span id="importStatus" class="text-sm text-slate-500">No file selected</span></div><div id="payments" class="mt-6 space-y-4"><div class="empty-card">Loading payment alerts…</div></div></section><section class="form-card mt-10"><p class="section-kicker">LEADERBOARD</p><h2 class="text-2xl font-black">Approved votes by nominee</h2><div id="leaderboard" class="mt-6 space-y-3"></div></section></main>
<script>
const {db: appDb, auth: appAuth}=window.appState;const {showToast: notify,formatDate: formatDateUtil,loadNominees: fetchNominees,escapeHtml: htmlEscape}=window.appUtils;let submissions=[];let nominees=[];let unsubscribe=null;function money(n){return `₦${Number(n||0).toLocaleString()}`;}function render(){const pending=submissions.filter(x=>x.status==='pending');document.getElementById('pendingCount').textContent=pending.length;document.getElementById('pendingStat').textContent=pending.length;document.getElementById('approvedStat').textContent=submissions.filter(x=>x.status==='approved').reduce((s,x)=>s+Number(x.voteUnits||0),0).toLocaleString();document.getElementById('valueStat').textContent=money(submissions.filter(x=>x.status==='approved').reduce((s,x)=>s+Number(x.amount||0),0));document.getElementById('payments').innerHTML=pending.length?pending.map(x=>`<article class="payment-row"><div class="flex-1"><div class="flex flex-wrap items-center gap-2"><span class="category-tag">${htmlEscape(x.category)}</span><span class="text-xs text-slate-500">${formatDateUtil(x.createdAt)}</span></div><h3 class="mt-2 text-lg font-black">${htmlEscape(x.nomineeName)} <span class="text-pink-600">· ${x.voteUnits} votes</span></h3><p class="mt-1 text-sm text-slate-600">${htmlEscape(x.fullName)} · ${htmlEscape(x.phone)} · ${htmlEscape(x.bank||'Bank not stated')}</p><p class="mt-1 text-sm text-slate-500">Payment: <b>${money(x.amount)}</b> · Ref: ${htmlEscape(x.paymentReference)}</p>${x.senderName?`<p class="text-sm text-slate-500">Sender account: ${htmlEscape(x.senderName)}</p>`:''}</div><div class="flex shrink-0 gap-2"><button class="approve-btn" data-id="${x.id}">Approve</button><button class="reject-btn" data-id="${x.id}">Reject</button></div></article>`).join(''):'<div class="empty-card">No pending payments. New submissions will appear here automatically.</div>';document.querySelectorAll('.approve-btn').forEach(b=>b.onclick=()=>moderate(b.dataset.id,'approved'));document.querySelectorAll('.reject-btn').forEach(b=>b.onclick=()=>moderate(b.dataset.id,'rejected'));const leaderboardRows=nominees.slice().sort((a,b)=>Number(b.votes||0)-Number(a.votes||0)||String(a.name||'').localeCompare(String(b.name||'')));document.getElementById('leaderboard').innerHTML=leaderboardRows.length?leaderboardRows.map((nominee,i)=>`<div class="leader-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="flex-1 font-bold">${htmlEscape(nominee.name)}</span><span class="text-xs text-slate-500">${htmlEscape(nominee.category||'')}</span><strong>${Number(nominee.votes||0).toLocaleString()} votes</strong></div>`).join(''):'<div class="empty-card">No nominees loaded yet. Import the official nominee list above.</div>';}
async function moderate(id,status){const row=submissions.find(x=>x.id===id);if(!row||!confirm(`${status==='approved'?'Approve':'Reject'} ${row.voteUnits} vote(s) for ${row.nomineeName}?`))return;try{const ref=appDb().collection('paymentSubmissions').doc(id);await appDb().runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists||snap.data().status!=='pending')throw new Error('This submission was already reviewed.');const data=snap.data();if(status==='approved'){const nomineeRef=appDb().collection('nominees').doc(data.nomineeId);const nominee=await tx.get(nomineeRef);if(!nominee.exists)throw new Error('Nominee no longer exists.');tx.update(nomineeRef,{votes:Number(nominee.data().votes||0)+Number(data.voteUnits||0)});}tx.update(ref,{status,reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),reviewedBy:appAuth().currentUser.uid,approvedVotes:status==='approved'?Number(data.voteUnits||0):0});});nominees=await fetchNominees();render();notify(status==='approved'?'Payment approved and votes counted.':'Payment rejected.');}catch(e){notify(e.message||'Could not update payment.','error');}}
async function restartVoting(){const status=document.getElementById('restartStatus');const button=document.getElementById('restartVoting');const answer=window.prompt('This clears all payment submissions and resets every nominee vote count to zero. Type RESET to continue.');if(answer!=='RESET'){status.textContent='Cancelled';return;}button.disabled=true;status.textContent='Resetting…';try{if(!window.appState.firebaseReady()||!appAuth()?.currentUser)throw new Error('Your admin session is not ready. Sign in again and retry.');const [nomineeSnap,paymentSnap]=await Promise.all([appDb().collection('nominees').get(),appDb().collection('paymentSubmissions').get()]);const operations=[];nomineeSnap.docs.forEach(doc=>operations.push({type:'reset',ref:doc.ref}));paymentSnap.docs.forEach(doc=>operations.push({type:'delete',ref:doc.ref}));operations.push({type:'event',ref:appDb().collection('settings').doc('event')});for(let i=0;i<operations.length;i+=450){const batch=appDb().batch();operations.slice(i,i+450).forEach(op=>{if(op.type==='reset')batch.update(op.ref,{votes:0});else if(op.type==='delete')batch.delete(op.ref);else batch.set(op.ref,{status:'active',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});});await batch.commit();}nominees=await fetchNominees();submissions=[];render();status.textContent='Restart complete';notify(`Voting restarted. Cleared ${paymentSnap.size} payment submissions and reset ${nomineeSnap.size} nominees.`);}catch(error){status.textContent=error?.code==='permission-denied'?'Firestore permission denied':'Reset failed';notify('Could not restart voting: '+(error?.message||'permission denied'),'error');}finally{button.disabled=false;}}async function start(){if(!(await window.appUtils.requireAdmin()))return;document.getElementById('adminEmail').textContent=appAuth().currentUser.email||'';nominees=await fetchNominees();if(window.appState.firebaseReady()){unsubscribe=appDb().collection('paymentSubmissions').onSnapshot(snap=>{submissions=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));render();},error=>{document.getElementById('payments').innerHTML='<div class="empty-card">Could not load payment submissions. Confirm the deployed rules and admins document.</div><p class="mt-3 text-xs text-slate-500">Signed-in UID: '+htmlEscape(appAuth().currentUser?.uid||'unknown')+'</p>';notify('Payment inbox could not be read: '+(error?.message||'permission denied'),'error');});}render();}document.getElementById('logout').onclick=async()=>{await appAuth().signOut();location.href='index.html';};document.getElementById('restartVoting').onclick=restartVoting;document.getElementById('nomineeFile').onchange=async(e)=>{const file=e.target.files[0];if(!file)return;const status=document.getElementById('importStatus');status.textContent=`Reading ${file.name}…`;try{let rows=[];const lower=file.name.toLowerCase();const parseText=(text)=>{if(lower.endsWith('.json')||text.trim().startsWith('['))return JSON.parse(text);const lines=text.trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return [];const headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());return lines.map(line=>{const values=line.split(',').map(x=>x.trim());return Object.fromEntries(headers.map((h,i)=>[h,values[i]||'']));});};if(lower.endsWith('.zip')){const zip=await JSZip.loadAsync(file);const entries=Object.values(zip.files).filter(x=>!x.dir);const dataEntry=entries.find(x=>/\.(json|csv)$/i.test(x.name));if(dataEntry){const text=await dataEntry.async('text');rows=parseText(text);}else{const imageEntries=entries.filter(x=>/\.(jpe?g|png|webp)$/i.test(x.name));rows=imageEntries.map(entry=>{const filename=entry.name.split('/').pop();const ext=filename.slice(filename.lastIndexOf('.')).toLowerCase();const base=filename.slice(0,filename.lastIndexOf('.'));return {name:base.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim(),category:'MR & MISS FRESH 2026',votes:0,image:`images/nominees/${window.appUtils.safeId(base).replace(/_/g,'-')}${ext}`};});}}else{rows=parseText(await file.text());}if(!Array.isArray(rows)||!rows.length)throw new Error('No nominee rows or image files found.');const batch=appDb().batch();let imported=0;rows.forEach(row=>{const name=String(row.name||row.nominee||row.nomineename||'').trim();const category=String(row.category||row.position||'MR & MISS FRESH 2026').trim().toUpperCase();if(!name||!category)return;const id=String(row.id||`${window.appUtils.safeId(category)}__${window.appUtils.safeId(name)}`);batch.set(appDb().collection('nominees').doc(id),{name,category,votes:Number(row.votes||0),image:String(row.image||'')},{merge:true});imported++;});if(!imported)throw new Error('No valid nominee records found.');await batch.commit();nominees=await fetchNominees();render();status.textContent=`Imported ${imported} nominee${imported===1?'':'s'} successfully.`;notify(`Imported ${imported} nominees. The leaderboard is updated.`);}catch(err){status.textContent=err?.code==='permission-denied'?'Import blocked by Firestore rules':'Import failed';notify(err?.code==='permission-denied'?'Firestore denied this write. Deploy firestore.rules and ensure the signed-in UID is in admins.':(err.message||'Could not import nominee list.'),'error');}e.target.value='';};start();
</script></body></html>
